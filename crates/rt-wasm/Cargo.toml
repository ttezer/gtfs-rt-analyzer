[package]
name = "gtfs-rt-wasm"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "WebAssembly report adapter for the GTFS-Realtime decoder."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
gtfs-rt-model = { path = "../rt-model" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
