name: Checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    # Bir job sınırsız kalırsa BAŞARISIZ OLAMAZ, yalnızca bekler: asılı kalan bir
    # koşum kırmızı yanmadan runner'ı saatlerce tutar.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install toolchain
        run: rustup component add clippy rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: cargo-${{ runner.os }}-

      - name: Test
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Formatting
        run: cargo fmt --all -- --check

  # Fuzz, kısa ve süreye bağlı koşar: amaç kapsamlı arama değil, açıkça bozuk bir
  # değişikliğin fark edilmesi. Derin arama elle, daha uzun sürelerle yapılır.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install nightly
        run: rustup toolchain install nightly --profile minimal

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            ~/.cargo/bin/cargo-fuzz
            fuzz/target
          key: fuzz-${{ runner.os }}-${{ hashFiles('fuzz/Cargo.toml') }}
          restore-keys: fuzz-${{ runner.os }}-

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked || true

      - name: Seed the corpus
        run: |
          for target in decode_feed read_schedule analyze_with_schedule; do
            mkdir -p "fuzz/corpus/$target"
            [ -d "fuzz/seeds/$target" ] && cp -r "fuzz/seeds/$target/." "fuzz/corpus/$target/" || true
          done

      - name: Fuzz
        run: |
          for target in decode_feed read_schedule analyze_with_schedule; do
            echo "--- $target"
            cargo +nightly fuzz run "$target" -- \
              -max_total_time=60 -rss_limit_mb=2048 -timeout=10
          done

  proxy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: proxy
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: proxy/package-lock.json

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test
