name: Deploy analyzer UI

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Refresh schedule scores"]
    types: [completed]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      # Paket kaynaktan üretilir ve depoda tutulmaz. Derlenmiş bir kopyayı
      # commit'lemek, kaynak ile yayınlanan sürümün sessizce ayrışmasına izin
      # verirdi: kural eklenip paket yeniden derlenmezse site eski davranışı
      # sunmaya devam eder ve hiçbir kapı bunu görmez.
      - name: Install Rust
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pages-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: pages-cargo-${{ runner.os }}-

      - name: Build WebAssembly package
        run: wasm-pack build crates/rt-wasm --target web --release --out-dir ../../ui/pkg

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload UI artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ui

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
