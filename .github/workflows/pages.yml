name: Deploy analyzer UI

on:
  push:
    branches: [main]
    paths:
      - "ui/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Refresh schedule scores"]
    types: [completed]

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: main

      # Paket kaynaktan üretilir ve depoda tutulmaz. Derlenmiş bir kopyayı
      # commit'lemek, kaynak ile yayınlanan sürümün sessizce ayrışmasına izin
      # verirdi: kural eklenip paket yeniden derlenmezse site eski davranışı
      # sunmaya devam eder ve hiçbir kapı bunu görmez.
      - name: Install Rust
        run: rustup target add wasm32-unknown-unknown

      - name: Install wasm-pack
        run: cargo install wasm-pack --version 0.15.0 --locked

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pages-cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: pages-cargo-${{ runner.os }}-

      - name: Build WebAssembly package
        run: wasm-pack build crates/rt-wasm --target web --release --out-dir ../../ui/pkg

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload UI artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ui

      # The Pages artifact is finalized before the artifact metadata API makes
      # it visible to deploy-pages. Without this small readiness gate the next
      # step can race the API and report "No artifacts named github-pages" even
      # though the upload just succeeded.
      - name: Wait for Pages artifact registration
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            artifact_count="$(gh api \
              --header 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
              --jq '[.artifacts[] | select(.name == "github-pages" and .expired == false)] | length')"
            if [ "$artifact_count" -gt 0 ]; then
              echo "Pages artifact is visible after ${attempt} attempt(s)."
              exit 0
            fi
            echo "Pages artifact is not visible yet; retrying in 5 seconds (${attempt}/12)."
            sleep 5
          done
          echo "Pages artifact was uploaded but did not become visible to the Actions API."
          exit 1

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
